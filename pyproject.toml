[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-analyzer"
version = "0.1.0"
description = "Passive packet sniffer and traffic analyzer with port-scan detection, built on Scapy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["scapy>=2.5.0"]

[project.scripts]
packet-analyzer = "packet_analyzer.cli:main"

[tool.setuptools]
packages = ["packet_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
